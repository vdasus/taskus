name: Release

# Push a tag like v0.2.0 to test, build and publish that version as a GitHub release.
# The tag sets the version; 0.x and pre-release versions (v1.0.0-rc.1) are marked as pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false   # the tests run package code; keep the write token out of .git/config
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Build
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # self-contained: runs anywhere; framework-dependent: needs the .NET 10 runtime, much smaller.
          for KIND in self-contained framework-dependent; do
            NAME=taskus-$VERSION-win-x64-$KIND
            SELF=$([ $KIND = self-contained ] && echo true || echo false)
            dotnet publish src/Taskus -c Release -r win-x64 --self-contained $SELF -p:PublishSingleFile=true -p:Version=$VERSION -o publish/$KIND
            mkdir -p release/$NAME
            cp publish/$KIND/taskus.exe publish/$KIND/appsettings.json README.md LICENSE release/$NAME/
            cp -r examples release/$NAME/
            (cd release && zip -qr $NAME.zip $NAME && sha256sum $NAME.zip > $NAME.zip.sha256)
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          case "$VERSION" in
            0.*|*-*) PRERELEASE=--prerelease ;;
            *) PRERELEASE= ;;
          esac
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 \
            --verify-tag $PRERELEASE --title "Taskus $VERSION" --generate-notes \
            --notes "Windows x64 builds: self-contained (no .NET needed) or framework-dependent (needs the .NET 10 runtime, smaller). Unpack a zip and run taskus.exe. See README.md and Docs/design.md."
