name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # Database tests run in Docker with psqlODBC on Linux; windows-latest has no Linux containers, so they skip there.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unixodbc odbc-postgresql
          echo "TASKUS_DB_TESTS=required" >> "$GITHUB_ENV"
      - run: dotnet test -c Release
